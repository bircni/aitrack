name: Publish pricing pack branch

# Orphan `pricing` branch = live rate pack for installed CLIs.
# Daily rebuild pulls LiteLLM + models.dev, merges Claude/Codex IO into the
# published supplement, and commits on top of the branch history when rates changed.
# Apps cache under ~/.config/aitrack/pricing/.
# No pack is bundled in the npm package — only tables/*.json ship as offline baseline.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'libs/aitrack-lib/src/pricing/**'
      - 'scripts/build-pricing-pack.ts'
      - '.github/workflows/publish-pricing-branch.yml'
  schedule:
    - cron: '15 6 * * *' # daily 06:15 UTC

permissions:
  contents: write

concurrency:
  group: publish-pricing-branch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Rebuild pricing pack from live feeds
        run: pnpm run pricing:update

      - name: Publish orphan pricing branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          PACK=artifacts/pricing-pack
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          workdir=$(mktemp -d)
          fresh=$(mktemp -d)
          cp "$PACK"/manifest.json "$PACK"/supplement.json "$PACK"/litellm.json "$PACK"/models_dev.json "$fresh"/
          cat > "$fresh/README.md" <<'EOF'
          # aitrack pricing pack

          Live rates for installed `aitrack` CLIs. Rebuilt daily from LiteLLM + models.dev
          (Claude/Codex IO merged into `supplement.json`; Cursor natives stay first-party).

          | File | Role |
          |---|---|
          | `manifest.json` | schema version, `updatedAt`, content hashes |
          | `supplement.json` | Claude/Codex/Cursor rates apps resolve against |
          | `litellm.json` | compact LiteLLM catalog snapshot |
          | `models_dev.json` | compact models.dev catalog snapshot |

          Fetch base: `https://raw.githubusercontent.com/bircni/aitrack/pricing/`
          Cache dir: `~/.config/aitrack/pricing/` (24h TTL).
          EOF

          cd "$workdir"
          if git clone -q --depth=1 --branch pricing "$remote" .; then
            # Timestamps and hashes change every run, so compare rates only.
            same=$(python3 - "$workdir" "$fresh" <<'PY'
          import json, sys
          old, new = sys.argv[1:]
          drop = ("updatedAt", "retrievedAt", "hashes")
          def load(d, f):
              if f == "README.md":
                  return open(f"{d}/{f}").read()
              return {k: v for k, v in json.load(open(f"{d}/{f}")).items() if k not in drop}
          files = ["README.md", "manifest.json", "supplement.json", "litellm.json", "models_dev.json"]
          print(all(load(old, f) == load(new, f) for f in files))
          PY
            )
          else
            git init -q
            git checkout -q -b pricing
            git remote add origin "$remote"
            same=False
          fi

          # Pushes to main still publish: a table bump needs a newer stamp than the bundled rates.
          if [ "$same" = True ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "Pricing pack unchanged, nothing to publish"
            exit 0
          fi

          cp "$fresh"/* .
          git add -A
          stamp=$(python3 -c 'import json; print(json.load(open("manifest.json"))["updatedAt"])')
          git commit -q -m "pricing pack ${stamp}"
          git push -q origin HEAD:pricing
          echo "Published pricing branch @ ${stamp}"
