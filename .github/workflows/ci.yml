name: CI

on:
  push:
    tags:
      - v*
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      # Audit reads only the lockfile, so it needs no install.
      - run: pnpm audit --audit-level=high

  test:
    name: Check
    runs-on: ubuntu-latest
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `nx affected` diffs against the merge base, which a shallow clone
          # does not have.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # The desktop matrix, Linux included, checks the Rust shell with its system libraries.
      - name: Check formatting
        run: pnpm nx affected -t format:check --exclude opentrack

      - name: Lint
        run: pnpm nx affected -t lint --exclude opentrack

      - name: Typecheck
        run: pnpm nx affected -t typecheck --exclude opentrack

      - name: Check unused files and dependencies
        run: pnpm nx affected -t check:unused --exclude opentrack

      - name: Test
        run: pnpm nx affected -t test --configuration ci --exclude opentrack

      - name: Build
        run: pnpm nx affected -t build --exclude opentrack

      - name: CLI smoke tests
        run: pnpm nx affected -t test:smoke
        env:
          SMOKE_CLI: dist/cli.js

      - name: Verify publish tarballs
        run: pnpm nx affected -t package:check

  cross-platform:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Avoid the native runner's allocation crash after successful Windows tasks.
      NX_NATIVE_COMMAND_RUNNER: ${{ matrix.os == 'windows-latest' && 'false' || 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            installer: target/release/bundle/dmg/*.dmg
            cargo-jobs: 3
          - os: windows-latest
            platform: windows-x64
            installer: target/release/bundle/nsis/*.exe
            cargo-jobs: 2
          - os: ubuntu-latest
            platform: linux-x64
            installer: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
            cargo-jobs: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # The Ubuntu Check job already runs these on Linux.
      - name: CLI smoke tests
        if: runner.os != 'Linux'
        run: pnpm nx affected -t test:smoke
        env:
          SMOKE_CLI: dist/cli.js

      - name: Verify publish tarballs
        if: runner.os != 'Linux'
        run: pnpm nx affected -t package:check

      - name: Check Rust formatting
        run: pnpm nx run opentrack:format:check

      # The Rust shell embeds the renderer and bundles the native Node sidecar;
      # Nx builds those dependencies without running their JS checks or tests.
      - name: Lint Rust
        run: pnpm nx run opentrack:lint

      - name: Test Rust
        run: pnpm nx run opentrack:test

      - name: Package and check Opentrack
        run: pnpm nx run opentrack:bundle:check
        env:
          CARGO_BUILD_JOBS: ${{ matrix.cargo-jobs }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentrack-${{ matrix.platform }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
