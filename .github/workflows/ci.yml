name: CI

on:
  push:
    tags:
      - v*
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level=high

  test:
    name: Check
    runs-on: ubuntu-latest
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `nx affected` diffs against the merge base, which a shallow clone
          # does not have.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          python - <<'PYTHON'
          import os, tomllib
          with open("rust-toolchain.toml", "rb") as source:
              toolchain = tomllib.load(source)["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={toolchain['channel']}", file=output)
              print(f"components={','.join(toolchain['components'])}", file=output)
          PYTHON

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}
          components: ${{ steps.rust-toolchain.outputs.components }}

      # opentrack's Tauri shell links against WebKitGTK and the tray libraries on Linux.
      - name: Install Tauri system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Check formatting
        run: pnpm nx affected -t format:check

      - name: Lint
        run: pnpm nx affected -t lint

      - name: Typecheck
        run: pnpm nx affected -t typecheck

      - name: Check unused files and dependencies
        run: pnpm nx affected -t check:unused

      - name: Test
        run: pnpm nx affected -t test --configuration ci

      - name: Build
        run: pnpm nx affected -t build

      - name: CLI smoke tests
        run: pnpm nx affected -t test:smoke
        env:
          SMOKE_CLI: dist/cli.js

      - name: Verify publish tarballs
        run: pnpm nx affected -t package:check

  rust:
    name: Rust (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Avoid the native runner's allocation crash after successful Windows tasks.
      NX_NATIVE_COMMAND_RUNNER: ${{ matrix.os == 'windows-latest' && 'false' || 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            installer: target/release/bundle/dmg/*.dmg
          - os: windows-latest
            platform: windows-x64
            installer: target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          python - <<'PYTHON'
          import os, tomllib
          with open("rust-toolchain.toml", "rb") as source:
              toolchain = tomllib.load(source)["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={toolchain['channel']}", file=output)
              print(f"components={','.join(toolchain['components'])}", file=output)
          PYTHON

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}
          components: ${{ steps.rust-toolchain.outputs.components }}

      - name: Check Rust formatting
        run: pnpm nx run opentrack:format:check

      # The Rust shell embeds the renderer and bundles the native Node sidecar;
      # Nx builds those dependencies without running their JS checks or tests.
      - name: Lint Rust
        run: pnpm nx run opentrack:lint

      - name: Test Rust
        run: pnpm nx run opentrack:test

      - name: Package and check Opentrack
        run: pnpm nx run opentrack:bundle:check

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opentrack-${{ matrix.platform }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
