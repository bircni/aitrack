name: CI

on:
  push:
    tags:
      - v*
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level=high

  test:
    name: Check
    runs-on: ubuntu-latest
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `nx affected` diffs against the merge base, which a shallow clone
          # does not have.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # The Rust shell ships only for macOS and Windows, whose jobs check it; here it would
      # only be compiled again, against Linux-only WebKitGTK.
      - name: Check formatting
        run: pnpm nx affected -t format:check --exclude opentrack

      - name: Lint
        run: pnpm nx affected -t lint --exclude opentrack

      - name: Typecheck
        run: pnpm nx affected -t typecheck --exclude opentrack

      - name: Check unused files and dependencies
        run: pnpm nx affected -t check:unused --exclude opentrack

      - name: Test
        run: pnpm nx affected -t test --configuration ci --exclude opentrack

      - name: Build
        run: pnpm nx affected -t build --exclude opentrack

      - name: CLI smoke tests
        run: pnpm nx affected -t test:smoke
        env:
          SMOKE_CLI: dist/cli.js

      - name: Verify publish tarballs
        run: pnpm nx affected -t package:check

  cross-platform:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Avoid the native runner's allocation crash after successful Windows tasks.
      NX_NATIVE_COMMAND_RUNNER: ${{ matrix.os == 'windows-latest' && 'false' || 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            installer: target/release/bundle/dmg/*.dmg
          - os: windows-latest
            platform: windows-x64
            installer: target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: CLI smoke tests
        run: pnpm nx affected -t test:smoke
        env:
          SMOKE_CLI: dist/cli.js

      - name: Verify publish tarballs
        run: pnpm nx affected -t package:check

      - name: Check Rust formatting
        run: pnpm nx run opentrack:format:check

      # The Rust shell embeds the renderer and bundles the native Node sidecar;
      # Nx builds those dependencies without running their JS checks or tests.
      - name: Lint Rust
        run: pnpm nx run opentrack:lint

      - name: Test Rust
        run: pnpm nx run opentrack:test

      - name: Package and check Opentrack
        run: pnpm nx run opentrack:bundle:check

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opentrack-${{ matrix.platform }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
