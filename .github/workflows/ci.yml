name: CI

on:
  push:
    # main runs fill the Rust and Nx caches that pull requests restore.
    branches: [main]
    tags:
      - v*
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Audit reads only the lockfile, so it needs no install.
      - run: bun audit --audit-level=high

  test:
    name: Check
    runs-on: ubuntu-latest
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `nx affected` diffs against the merge base, which a shallow clone
          # does not have.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # One run lets Nx schedule the checks in parallel. The desktop matrix, Linux
      # included, checks the Rust shell with its system libraries.
      - name: Format, lint, typecheck, unused, test and build
        run: bun nx affected -t format:check,lint,typecheck,check:unused,test,build --configuration ci --exclude opentrack

      # Separate from the unit tests, which would otherwise pick up SMOKE_CLI too.
      - name: CLI smoke tests and publish tarballs
        run: bun nx affected -t test:smoke,package:check
        env:
          SMOKE_CLI: dist/cli.js

  cross-platform:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Avoid the native runner's allocation crash after successful Windows tasks.
      NX_NATIVE_COMMAND_RUNNER: ${{ matrix.os == 'windows-latest' && 'false' || 'true' }}
      # Debug info only slows the clippy and test builds; nothing here is debugged.
      CARGO_PROFILE_DEV_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            installer: target/release/bundle/dmg/*.dmg
            cargo-jobs: 3
          - os: windows-latest
            platform: windows-x64
            installer: target/release/bundle/nsis/*.exe
            cargo-jobs: 2
          - os: ubuntu-latest
            platform: linux-x64
            installer: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
            cargo-jobs: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # The Ubuntu Check job already runs these on Linux.
      - name: CLI smoke tests and publish tarballs
        if: runner.os != 'Linux'
        run: bun nx affected -t test:smoke,package:check
        env:
          SMOKE_CLI: dist/cli.js

      # A pull request that cannot change the desktop app skips its Rust build.
      - name: Check whether Opentrack is affected
        id: opentrack
        shell: bash
        run: |
          affected=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            projects=$(bun nx show projects --affected -p opentrack --json)
            [[ $projects == *'"opentrack"'* ]] || affected=
          fi
          echo "affected=$affected" >> "$GITHUB_OUTPUT"

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux' && steps.opentrack.outputs.affected
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.opentrack.outputs.affected
        with:
          # Pull request caches are visible only to that pull request; main's serve them all.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      - name: Check Rust formatting
        if: steps.opentrack.outputs.affected
        run: bun nx run opentrack:format:check

      # The Rust shell embeds the renderer and bundles the native Node sidecar;
      # Nx builds those dependencies without running their JS checks or tests.
      - name: Lint Rust
        if: steps.opentrack.outputs.affected
        run: bun nx run opentrack:lint

      - name: Test Rust
        if: steps.opentrack.outputs.affected
        run: bun nx run opentrack:test

      - name: Package and check Opentrack
        if: steps.opentrack.outputs.affected
        run: bun nx run opentrack:bundle:check
        env:
          CARGO_BUILD_JOBS: ${{ matrix.cargo-jobs }}

      - name: Upload installer artifact
        if: steps.opentrack.outputs.affected
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentrack-${{ matrix.platform }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
