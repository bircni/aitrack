name: Publish

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    needs: opentrack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # opentrack's Tauri shell links against WebKitGTK and the tray libraries on Linux.
      - name: Install Tauri system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Validate
        run: pnpm run validate

      - name: Build
        run: pnpm run build

      - name: Publish
        # `id-token: write` above + provenance here attaches a signed build
        # attestation linking the tarball to this workflow run.
        # `-r` publishes every non-private workspace package in dependency
        # order (aitrack-lib before aitrack) and rewrites the `workspace:*`
        # range to the version it just published.
        run: pnpm publish -r --no-git-checks --provenance

  opentrack:
    name: Package Opentrack (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      NX_NATIVE_COMMAND_RUNNER: ${{ matrix.os == 'windows-latest' && 'false' || 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            # The setup.exe doubles as the update package; each .sig is an updater signature.
            installer: target/release/bundle/nsis/*.exe*
          - os: macos-latest
            platform: macos-arm64
            installer: target/release/bundle/dmg/*.dmg target/release/bundle/macos/*.app.tar.gz*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Package and check
        run: pnpm nx run opentrack:bundle:check -c release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # One flat folder, so the release job finds every file at the top of the artifact.
      - name: Collect installer files
        shell: bash
        env:
          INSTALLER: ${{ matrix.installer }}
        run: mkdir installers && cp $INSTALLER installers/ # Unquoted: the globs must expand.

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opentrack-${{ matrix.platform }}
          path: installers
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: [publish, opentrack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .node-version
            CHANGELOG.md
            scripts/release-notes.ts
            scripts/updater-manifest.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Extract GitHub release notes
        run: |
          node scripts/release-notes.ts "$GITHUB_REF_NAME" CHANGELOG.md > release-notes.md
          printf '\nOpentrack installers: Windows builds are unsigned; macOS builds are ad hoc signed and not notarized. Windows SmartScreen and macOS Gatekeeper may block the first launch.\n' >> release-notes.md

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: opentrack-*
          path: installers
          merge-multiple: true

      - name: Write the updater manifest
        run: node scripts/updater-manifest.ts "$GITHUB_REF_NAME" installers > installers/latest.json

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Set the flag explicitly so a re-run can also clear a stale prerelease flag.
            edit_flags=(--prerelease="$is_prerelease")
            if [[ "$is_prerelease" == false ]]; then
              edit_flags+=(--latest)
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "${edit_flags[@]}"
          else
            create_flags=()
            if [[ "$is_prerelease" == true ]]; then
              create_flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "${create_flags[@]}"
          fi

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          installers/*.exe installers/*.dmg installers/*.app.tar.gz installers/latest.json

  homebrew:
    name: Update the Homebrew cask
    needs: github-release
    # Prereleases never become the cask's version.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .node-version
            scripts/homebrew-cask.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Download the macOS disk image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opentrack-macos-arm64
          path: installers

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bircni/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Commit the cask
        shell: bash
        run: |
          mkdir -p tap/Casks
          node scripts/homebrew-cask.ts "$GITHUB_REF_NAME" installers/*.dmg > tap/Casks/opentrack.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/opentrack.rb
          if ! git diff --cached --quiet; then
            git commit -m "opentrack ${GITHUB_REF_NAME#v}"
            git push
          fi
