name: Publish

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    needs: opentrack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          python - <<'PYTHON'
          import os, tomllib
          with open("rust-toolchain.toml", "rb") as source:
              toolchain = tomllib.load(source)["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={toolchain['channel']}", file=output)
              print(f"components={','.join(toolchain['components'])}", file=output)
          PYTHON

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}
          components: ${{ steps.rust-toolchain.outputs.components }}

      # opentrack's Tauri shell links against WebKitGTK and the tray libraries on Linux.
      - name: Install Tauri system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Validate
        run: pnpm run validate

      - name: Build
        run: pnpm run build

      - name: Publish
        # `id-token: write` above + provenance here attaches a signed build
        # attestation linking the tarball to this workflow run.
        # `-r` publishes every non-private workspace package in dependency
        # order (aitrack-lib before aitrack) and rewrites the `workspace:*`
        # range to the version it just published.
        run: pnpm publish -r --no-git-checks --provenance

  opentrack:
    name: Package Opentrack (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      NX_NATIVE_COMMAND_RUNNER: ${{ matrix.os == 'windows-latest' && 'false' || 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            installer: target/release/bundle/nsis/*.exe
          - os: macos-latest
            platform: macos-arm64
            installer: target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi

      - name: Read Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          python - <<'PYTHON'
          import os, tomllib
          with open("rust-toolchain.toml", "rb") as source:
              toolchain = tomllib.load(source)["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={toolchain['channel']}", file=output)
              print(f"components={','.join(toolchain['components'])}", file=output)
          PYTHON

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}
          components: ${{ steps.rust-toolchain.outputs.components }}

      - name: Package and check
        run: pnpm nx run opentrack:bundle:check

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opentrack-${{ matrix.platform }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: [publish, opentrack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .node-version
            CHANGELOG.md
            scripts/release-notes.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Extract GitHub release notes
        run: |
          node scripts/release-notes.ts "$GITHUB_REF_NAME" CHANGELOG.md > release-notes.md
          printf '\nOpentrack installers: Windows builds are unsigned; macOS builds are ad hoc signed and not notarized. Windows SmartScreen and macOS Gatekeeper may block the first launch.\n' >> release-notes.md

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: opentrack-*
          path: installers
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Set the flag explicitly so a re-run can also clear a stale prerelease flag.
            edit_flags=(--prerelease="$is_prerelease")
            if [[ "$is_prerelease" == false ]]; then
              edit_flags+=(--latest)
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "${edit_flags[@]}"
          else
            create_flags=()
            if [[ "$is_prerelease" == true ]]; then
              create_flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "${create_flags[@]}"
          fi

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          installers/*.exe installers/*.dmg
