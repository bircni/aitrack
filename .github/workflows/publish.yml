name: Publish

on:
  push:
    tags:
      - v*

permissions:
  contents: read

env:
  NX_NO_CLOUD: true # Never restore release builds from PR runs' remote cache.

jobs:
  publish:
    name: Publish to npm
    needs: opentrack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Nx Rust plugin reads Cargo metadata to build the project graph.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # The opentrack jobs check the Rust shell, which needs WebKitGTK on Linux.
      - name: Validate and build
        run: bun run validate --exclude opentrack

      # Library first: bun rewrites the CLI's `workspace:*` to its exact version.
      - name: Pack
        run: |
          for package in libs/aitrack-lib apps/aitrack; do
            (cd "$package" && bun pm pack --quiet --destination "$GITHUB_WORKSPACE/packs")
          done

      - name: Generate SBOMs
        run: node scripts/sbom.ts sbom packs/*.tgz

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom
          if-no-files-found: error

      # bun cannot publish with provenance, so npm publishes bun's tarballs; provenance
      # needs `id-token: write`.
      - name: Publish
        run: |
          version=$(node -p 'require("./package.json").version')
          for package in aitrack-lib aitrack; do
            npm publish "packs/$package-$version.tgz" --provenance
          done

  opentrack:
    name: Package Opentrack (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      NX_NATIVE_COMMAND_RUNNER: ${{ matrix.os == 'windows-latest' && 'false' || 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            # The setup.exe doubles as the update package; each .sig is an updater signature.
            installer: target/release/bundle/nsis/*.exe*
          - os: macos-latest
            platform: macos-arm64
            installer: target/release/bundle/dmg/*.dmg target/release/bundle/macos/*.app.tar.gz*
          - os: ubuntu-latest
            platform: linux-x64
            installer: target/release/bundle/appimage/*.AppImage* target/release/bundle/deb/*.deb*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Build the renderer and sidecar
        run: bun nx run-many -t build,sea -p opentrack-ui

      - name: Check the Rust shell
        run: bun nx run-many -t format:check,lint,test -p opentrack

      # The JS and sidecar builds ran above without the signing key and are restored from
      # Nx's local cache here; the Tauri build and its cargo build scripts do see it.
      - name: Package
        run: bun nx run opentrack:package -c release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Check the bundle
        run: bun nx run opentrack:bundle:check --excludeTaskDependencies

      # One flat folder, so the release job finds every file at the top of the artifact.
      - name: Collect installer files
        shell: bash
        env:
          INSTALLER: ${{ matrix.installer }}
        run: |
          # shellcheck disable=SC2086 # Unquoted: the globs must expand.
          mkdir installers && cp $INSTALLER installers/

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentrack-${{ matrix.platform }}
          path: installers
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: [publish, opentrack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .node-version
            CHANGELOG.md
            scripts/*.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Extract GitHub release notes
        run: |
          node scripts/release-notes.ts "$GITHUB_REF_NAME" CHANGELOG.md > release-notes.md
          printf '\nOpentrack installers: Windows builds are unsigned; macOS builds are ad hoc signed and not notarized. Windows SmartScreen and macOS Gatekeeper may block the first launch. Linux AppImage and .deb packages are built on Ubuntu 24.04 for x86_64.\n' >> release-notes.md

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: opentrack-*
          path: installers
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Write the updater manifest
        run: node scripts/updater-manifest.ts "$GITHUB_REF_NAME" installers > installers/latest.json

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Set the flag explicitly so a re-run can also clear a stale prerelease flag.
            edit_flags=(--prerelease="$is_prerelease")
            if [[ "$is_prerelease" == false ]]; then
              edit_flags+=(--latest)
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "${edit_flags[@]}"
          else
            create_flags=()
            if [[ "$is_prerelease" == true ]]; then
              create_flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "${create_flags[@]}"
          fi

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          installers/*.exe installers/*.dmg installers/*.app.tar.gz installers/*.AppImage
          installers/*.deb installers/latest.json sbom/*.cdx.json

  homebrew:
    name: Update the Homebrew cask
    needs: github-release
    # Prereleases never become the cask's version.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .node-version
            scripts/*.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Download the macOS disk image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opentrack-macos-arm64
          path: installers

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bircni/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Commit the cask
        shell: bash
        run: |
          mkdir -p tap/Casks
          node scripts/homebrew-cask.ts "$GITHUB_REF_NAME" installers/*.dmg > tap/Casks/opentrack.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/opentrack.rb
          if ! git diff --cached --quiet; then
            git commit -m "opentrack ${GITHUB_REF_NAME#v}"
            git push
          fi
