name: Publish

on:
  push:
    tags:
      - v*
  # Builds and checks every release file without releasing anything.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # Built once, so the later jobs, the npm one above all, compile nothing.
      - name: Build xtask
        run: cargo build --locked -p xtask

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xtask
          path: target/debug/xtask
          if-no-files-found: error

      - id: version
        shell: bash
        run: |
          version=$(target/debug/xtask version)
          if [[ "$GITHUB_REF_TYPE" == tag && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::$GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  cli:
    name: Build the CLI (${{ matrix.npm }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, npm: win32-x64 }
          # zig links against glibc 2.31, so older distributions run the binary too.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, npm: linux-x64, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, npm: linux-arm64, zig: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - if: matrix.zig
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          if [[ -n "${{ matrix.zig }}" ]]; then
            cargo zigbuild --release --locked -p aitrack-cli --target "${{ matrix.target }}.2.31"
          else
            cargo build --release --locked -p aitrack-cli --target "${{ matrix.target }}"
          fi
          exe=""; [[ "${{ runner.os }}" == Windows ]] && exe=.exe
          mkdir out
          cp "target/${{ matrix.target }}/release/aitrack$exe" "out/aitrack-${{ matrix.npm }}$exe"

      - name: Check the binary reports the release version
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          reported=$(out/aitrack-* --version)
          if [[ "$reported" != "$VERSION" ]]; then
            echo "::error::the binary reports $reported, expected $VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.npm }}
          path: out
          if-no-files-found: error

  opentrack:
    name: Package Opentrack (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            formats: nsis
            # The setup.exe doubles as the update package; each .sig is an updater signature.
            installer: target/release/bundle/nsis/*.exe*
          - os: macos-latest
            platform: macos-arm64
            formats: app,dmg
            installer: target/release/bundle/dmg/*.dmg target/release/bundle/macos/*.app.tar.gz*
          - os: ubuntu-24.04 # The release notes name this; the glibc floor follows it.
            platform: linux-x64
            formats: appimage,deb
            installer: target/release/bundle/appimage/*.AppImage* target/release/bundle/deb/*.deb*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-packager@0.11.8

      - name: Package
        working-directory: apps/opentrack
        run: cargo packager --release --formats ${{ matrix.formats }}

      - name: Lay out and sign the updater files
        run: cargo xtask updater-artifacts target/release/packager target/release/bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Check the bundle
        run: cargo xtask smoke-bundle

      # One flat folder, so the release job finds every file at the top of the artifact.
      - name: Collect installer files
        shell: bash
        env:
          INSTALLER: ${{ matrix.installer }}
        run: |
          # shellcheck disable=SC2086 # Unquoted: the globs must expand.
          mkdir installers && cp $INSTALLER installers/

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentrack-${{ matrix.platform }}
          path: installers
          if-no-files-found: error

  npm-tarballs:
    name: Pack the npm packages
    needs: [version, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            README.md
            npm
          sparse-checkout-cone-mode: false

      - name: Download xtask
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask
          path: bin

      - run: chmod +x bin/xtask

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: binaries
          merge-multiple: true

      - run: bin/xtask npm-pack "${{ needs.version.outputs.version }}" binaries packs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: packs
          if-no-files-found: error

  # Runs before npm, the one step that cannot be undone, so its failures surface first. Installed
  # apps read releases/latest, so the release stays a draft until its assets are all uploaded.
  draft-release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [npm-tarballs, opentrack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md

      - name: Download xtask
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask
          path: bin

      - run: chmod +x bin/xtask

      - name: Extract GitHub release notes
        run: |
          bin/xtask release-notes "$GITHUB_REF_NAME" CHANGELOG.md > release-notes.md
          printf '\nOpentrack installers: Windows builds are unsigned; macOS builds are ad hoc signed and not notarized. Windows SmartScreen and macOS Gatekeeper may block the first launch. Linux AppImage and .deb packages are built on Ubuntu 24.04 for x86_64.\n\nThe aitrack-* files are the CLI for each platform; npm installs the right one for you.\n' >> release-notes.md

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: opentrack-*
          path: installers
          merge-multiple: true

      # The npm launcher falls back to these, checked against checksums.txt.
      - name: Download CLI binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: cli
          merge-multiple: true

      - name: Write the checksums and the updater manifest
        run: |
          (cd cli && sha256sum aitrack-* > checksums.txt)
          bin/xtask updater-manifest "$GITHUB_REF_NAME" installers > installers/latest.json

      - name: Create or update the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run finds the draft, or the release an earlier attempt finished.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

      - name: Upload files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          installers/*.exe installers/*.dmg installers/*.app.tar.gz installers/*.AppImage
          installers/*.deb installers/latest.json cli/aitrack-* cli/checksums.txt

  # Holds the npm credential, so it installs nothing and runs only the repo's own script.
  publish:
    name: Publish to npm
    needs: draft-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: npm/aitrack/targets.json

      # Only for the npm CLI, which provenance needs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download xtask
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask
          path: bin

      - run: chmod +x bin/xtask

      - name: Download tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: packs

      - name: Publish
        run: bin/xtask publish-npm "$GITHUB_REF_NAME" packs

  release:
    name: Publish GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Set the flag explicitly so a re-run can also clear a stale prerelease flag.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags=(--prerelease=true)
          else
            flags=(--prerelease=false --latest)
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            "${flags[@]}"

  homebrew:
    name: Update the Homebrew cask
    needs: release
    # Prereleases never become the cask's version.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download xtask
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask
          path: bin

      - run: chmod +x bin/xtask

      - name: Download the macOS disk image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opentrack-macos-arm64
          path: installers

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bircni/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Commit the cask
        shell: bash
        run: |
          mkdir -p tap/Casks
          bin/xtask homebrew-cask "$GITHUB_REF_NAME" installers/*.dmg > tap/Casks/opentrack.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/opentrack.rb
          if ! git diff --cached --quiet; then
            git commit -m "opentrack ${GITHUB_REF_NAME#v}"
            git push
          fi
