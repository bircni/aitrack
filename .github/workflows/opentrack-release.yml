name: opentrack release

on:
  push:
    tags:
      - opentrack-v*

permissions:
  contents: read

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The installer takes its name and version from Cargo.toml, not from the tag.
      - name: Check the tag matches the app version
        run: |
          version=$(grep -m1 '^version' apps/opentrack/Cargo.toml | cut -d '"' -f 2)
          if [ "opentrack-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME does not match version $version in apps/opentrack/Cargo.toml"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft
          --title "opentrack ${GITHUB_REF_NAME#opentrack-v}"
          --notes "Unsigned build: Windows SmartScreen will ask for confirmation."

  build:
    # Windows only for now: the Tauri bundle config ships the NSIS installer and a Windows sidecar.
    name: Build (Windows)
    needs: draft
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner image ships a stable Rust toolchain, which the Tauri build uses.
      - name: Package
        run: pnpm nx run opentrack:package

      - name: Upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          target/release/bundle/nsis/*.exe
