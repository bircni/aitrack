[package]
name = "opentrack"
version = "0.1.0"
description = "Tray shell for opentrack: window, tray icon and the Node sidecar that does the work."
license = "MIT"
edition = "2021"
publish = false

[[bin]]
name = "opentrack"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "time"] }

[features]
# `tauri build` turns this on; a plain `cargo build` then serves the built renderer as a dev build.
custom-protocol = ["tauri/custom-protocol"]
