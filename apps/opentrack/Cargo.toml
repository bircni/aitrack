[package]
name = "opentrack"
version = "0.1.0"
description = "opentrack: the tray popup for aitrack's live limits and usage."
license = "MIT"
edition = "2021"
publish = false

[[bin]]
name = "opentrack"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aitrack-core.workspace = true
indexmap = "2.14.2"
jiff = { version = "0.2.40", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
sha2 = "0.11.1"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSGraphics", "NSResponder", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[features]
# `tauri build` turns this on; a plain `cargo build` then serves the built renderer as a dev build.
custom-protocol = ["tauri/custom-protocol"]
