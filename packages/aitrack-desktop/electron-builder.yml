appId: com.bircni.aitrack
productName: aitrack
copyright: Copyright © Nicolas
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/pdfkit/**
  - out/main/ingestWorker.js
  - out/main/chunks/**
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
npmRebuild: false
