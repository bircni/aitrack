packages:
  - apps/*
  - libs/*

overrides:
  # brace-expansion 5.0.9 (via nx / minimatch) has DoS advisories fixed in
  # 5.0.12. Keep 2.x alone; only pin the vulnerable 5.x line.
  'brace-expansion@^5.0.0': '5.0.12'
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'
  '@nx/devkit>minimatch': 10.2.6
  'nx>minimatch': 10.2.6
  # nx 24.0 resolves undici 7.29.0, which has DoS and TLS advisories fixed in
  # 7.29.1. Keep the 8.x line that jsdom uses untouched.
  'undici@>=7.0.0 <7.29.1': '^7.29.1'
  # typed-rest-client (via stryker) pins qs 6.15.1, which has DoS advisories
  # fixed in 6.16.1.
  'typed-rest-client>qs': ^6.17.0

# Versions every package shares. `catalog:` in a package.json resolves to the
# entry here, so the toolchain is bumped in one place instead of three — and
# two packages can no longer end up compiling against different TypeScripts.
catalog:
  '@types/node': ^26.6.5
  '@typescript/native': 'npm:typescript@^7.0.2'
  '@vitest/coverage-v8': ^5.0.5
  chalk: '^6.0.1'
  tsx: '^4.23.15'
  typescript: 'npm:@typescript/typescript6@^6.0.2'
  vitest: ^5.0.5

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  nx: true
