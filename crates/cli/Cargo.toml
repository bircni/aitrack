[package]
name = "aitrack-cli"
description = "Track Claude Code, Codex and Cursor usage across machines."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "aitrack"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aitrack-core = { workspace = true, features = ["render"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
clap_complete = "4.6.11"
dialoguer = { version = "0.12.0", default-features = false }
indexmap = "2.14.2"
jiff = { version = "0.2.40", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
assert_cmd = "2.2.2"
serde_json = "1.0.154"
tempfile = "3.27.0"
